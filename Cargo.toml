[package]
name = "sequoia"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "Native Rust media player powered by mpv"
license = "MIT"

[dependencies]
ab_glyph = "=0.2.32"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = { version = "=0.32.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "=0.16.0"
lofty = "=0.22.4"
image = { version = "=0.25.6", default-features = false, features = ["png", "jpeg", "webp", "ico"] }
resvg = { version = "=0.45.1", default-features = false }
ureq = { version = "=3.1.2", features = ["json"] }
rand = "=0.9.2"
raw-window-handle = "0.6"
walkdir = "2"

[target.'cfg(windows)'.dependencies]
windows-core = "=0.61.2"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_SystemServices", "Win32_Graphics_Gdi", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
tempfile = "3"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
resvg = { version = "=0.45.1", default-features = false }
image = { version = "=0.25.6", default-features = false, features = ["ico"] }
winresource = "=0.1.23"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev]
debug = 0
